<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { 
      font-family: Arial, sans-serif; 
      font-weight: bold;
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .main-text { 
      font-size: 48px; 
      fill: #333;
    }
    .sub-text { 
      font-size: 24px; 
      fill: #666;
    }
    .bg-rect {
      fill: url(#grad);
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="bg-rect" width="800" height="200" rx="10" />
  <text x="400" y="80" class="text main-text">Cyrus Zhou</text>
  <text x="400" y="130" class="text sub-text">Senior Software Engineer | Full Stack Developer | Tech Innovator</text>
</svg> 